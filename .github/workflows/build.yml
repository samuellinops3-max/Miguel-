name: Build Little Nightmares PS3
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          gcc main.c -o jogo
          python3 build_pkg.py
          ls -lh
      - uses: actions/upload-artifact@v4
        with:
          name: Little-Nightmares-PS3
          path: little_nightmares.pkg